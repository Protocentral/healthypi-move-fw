# data_module.c is guarded by CONFIG_USB_DEVICE_STACK and compiles out while off.
#
# USB CAN BE RE-ENABLED LATER for continuous-streaming applications: migrate to
# the new USB device stack (CONFIG_USB_DEVICE_STACK_NEXT / USBD), restore the
# settings below, and re-enable USB init in hw_module.c (usb_init/CDC ISR).
#   CONFIG_USB_DEVICE_STACK=y
#   CONFIG_USB_DEVICE_PRODUCT="healthypi move"
#   CONFIG_USB_DEVICE_PID=0x0001
#   CONFIG_USB_DEVICE_VID=0x4440
#   CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

