#CONFIG_BT_DIS_SETTINGS=y
#CONFIG_BT_DIS_STR_MAX=100

# Reduced Bluetooth data packets for flash optimization
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# TX buffering for the streaming characteristics. ECG notifies ~16x/s while MCUmgr
# (DFU, FS reads) and the health-store sync share the same connection. On the
# stack defaults a burst on either side empties the pool, bt_gatt_notify() returns
# -ENOMEM and the ECG batch is simply gone — a contributor to the app's live ECG
# plot appearing only intermittently. (The primary fix for that report was in
# data_module.c: the ECG buffer was ALSO being notified on the BioZ characteristic,
# doubling this path's traffic with the wrong payload.)
#
# Sized against SRAM, not just latency: the L2CAP/ATT pools are the expensive pair
# at ~640 B per buffer. Measured on this tree — default -> 8/8 costs 3280 B and
# leaves 10.4 KB slack; 6/6 costs 1996 B and leaves ~11.7 KB. Given the v3.0.0
# field reports were LVGL allocation failures, doubling the default is the right
# trade. ACL TX is ~free here (52 B) but must stay BELOW CONFIG_BT_BUF_EVT_RX_COUNT
# (10): the controller may emit one Number-of-Completed-Packets event per
# outstanding ACL buffer, and bluetooth/buf.h BUILD_ASSERTs on it.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_TX_COUNT=6

# Preferred connection parameters (GAP PPCP). Units: intervals 1.25 ms,
# supervision timeout 10 ms.
#
# The supervision timeout was Zephyr's default of 42 = 420 ms, which is what a
# multi-minute OTA kept dying on: any RF gap longer than that — a hand over the
# watch, the phone pocketed, a microwave — tears the link down, and the watch
# logs "Disconnected ... reason 0x08" (BT_HCI_ERR_CONN_TIMEOUT) mid-upload. Four
# seconds rides out a transient without leaving a genuinely dead link hanging
# for long. Apple's Accessory Design Guidelines cap this at 6 s, so 400 is
# comfortably inside what iOS will grant; keep it there.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# BT_CTLR_DATA_LENGTH_MAX is a controller symbol: it belongs on the net core
# (set in app/sysbuild/ipc_radio/prj.conf), not the app/host core.

