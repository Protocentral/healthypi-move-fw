# --- Net-core (image 1) DFU, explicit ---
# These are auto-derived today from SB_CONFIG_NETCORE_APP_UPDATE (2-image build),
# but net-core OTA is bootloader-critical, so pin the load-bearing symbols here so
# a future default/Kconfig shift can't silently disable them (and shows a build
# warning if their deps ever stop being met).
# The nRF5340 net-core image-1 *primary* slot (slot2, flash area ID 3) is a
# deliberately-disabled RAM sim partition; MCUMGR_GRP_IMG_NRF5340_BOOTUTIL_HOOK
# makes the img-mgmt swap-state read for that slot return "unpopulated" instead of
# opening area 3 (which -ENOENTs by design) — WITHOUT it, an image-1 upload hits
# BOOT_SWAP_TYPE_PANIC and the client gets SMP rc=1. The upload lands in
# slot3_partition (QSPI) and MCUboot PCD-copies it to the net core on reboot.
CONFIG_MCUMGR_GRP_IMG_UPDATABLE_IMAGE_NUMBER=2
CONFIG_MCUMGR_GRP_IMG_NRF5340_BOOTUTIL_HOOK=y


