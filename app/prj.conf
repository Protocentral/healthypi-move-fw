# Display flush buffer bits-per-pixel. Must match the render depth (RGB565 =
# 16bpp) and the RGB565 panel; it was defaulting to 32, allocating the LVGL
# draw buffer (buf0) at 4 bytes/px instead of 2 -> ~30 KB wasted SRAM plus a
# 32->16 conversion per flush. P5: reclaim it for the screen cache.
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_THEME_DEFAULT_DARK=y
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
# LVGL object pool. Grown after placeholder fill-in (sparks/bars/ages) so the
# active tile + neighbors + one special screen fit without glyph draw OOM
# (lv_draw_label ASSERT_MALLOC). Carousel tiles are lazy-built to stay inside
# this budget; still allow a few resident heavy monitors.
#
# Raised 60K -> 80K for v3.0.0: three field reports of the watch restarting on a
# swipe (SpO2 plot, Settings, the pull-down shade) were LVGL allocation failures.
# The structural fix is hpi_scr_release_current() (the outgoing screen is now
# freed BEFORE the incoming one is built) plus carousel tile eviction; this is
# the fragmentation headroom on top of it. ~35 KB of SRAM was unallocated —
# check the build's RAM report still shows >=10 KB slack after any further bump.
# Note the LVGL draw buffers are static and do NOT come out of this pool.
CONFIG_LV_Z_MEM_POOL_SIZE=81920
#CONFIG_LV_MEM_CUSTOM=y
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=50
CONFIG_LV_Z_POINTER_INPUT=y
