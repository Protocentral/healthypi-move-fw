# HS-2 Tier 2: synthetic data generator. Lets us test trends / baselines / retention /
# sync-at-scale without wearing the watch for a week. Triggered ON DEMAND by the
# HPI_HS `SYNTH` MCUmgr command (id 6) over BLE -- never at boot. Every sample is
# branded HPI_HS_Q_SYNTHETIC.
#
# OFF DELIBERATELY -- DO NOT ENABLE IN ANYTHING THAT SHIPS. This fabricates
# physiologically plausible HR/temp/steps into the SAME store as real measurements.
# The only thing telling them apart is the HPI_HS_Q_SYNTHETIC quality bit, i.e. a
# client that forgets to filter renders invented vitals as if they were measured.
# Re-enable only for local testing, and remember the watch's store keeps whatever
# was already generated -- turning this off does not erase it.
# CONFIG_HPI_HS_SYNTH=y

