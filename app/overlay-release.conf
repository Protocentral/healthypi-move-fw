# Release overlay — build with:
#   RELEASE=1 ./build.sh --pristine
# (build.sh turns that into -Dapp_EXTRA_CONF_FILE=<this file> for the app image.)
#
# Everything here is about the artifact that ships to fielded watches; keep the
# development defaults in prj.conf.

# Debug logging options
CONFIG_LOG=n
CONFIG_CONSOLE=n

CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# C4: assertions off in the shipping image.
#
# This is a field-DFU requirement, not a size tweak. v3.0.0 is pushed onto three
# firmware generations, and the older ones were built when the app had three
# images (app + net + QSPI-XIP). A phone that still holds a 3-image-era package
# will offer image index 2 to a 2-image v3 device. With CONFIG_ASSERT=y that
# path can trip an assert inside img_mgmt and reset the watch mid-session; with
# assertions off it returns the ordinary SMP error (unused-slot lookup fails) and
# the update is simply refused. Overwrite-only MCUboot has no auto-revert, so a
# reset loop here is a bricked watch and an SWD recovery.
#
# Bench proof required before tagging: replay a 3-image-era zip against a build
# made with this overlay and confirm a clean SMP error, no reset, and no write to
# slot 4/5 (see M-D / KNOWN_ISSUES.md).
CONFIG_ASSERT=n
