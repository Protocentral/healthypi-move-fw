# HealthyPi Move nRF5340 hardware-only configuration.
# These symbols depend on the nRF5340 SoC, MCUboot image slots or NCS
# (Partition Manager, NCS MCUmgr samples) and must not be set on native_sim.

CONFIG_FLASH_LOAD_OFFSET=0x0000c000

# Partition Manager placement for the LittleFS volume (restored with PM). The
# static map in app/pm_static.yml fixes the actual address/size; these tell PM
# which region the partition belongs to.
CONFIG_PM_PARTITION_REGION_LITTLEFS_EXTERNAL=y
CONFIG_PM_PARTITION_SIZE_LITTLEFS=0x200000

# Enable the poweroff command (for power profiling)
CONFIG_POWEROFF=y

# MCUmgr image management / BLE DFU
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y

CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y

CONFIG_MCUMGR_GRP_IMG_UPDATABLE_IMAGE_NUMBER=1
CONFIG_MCUMGR_GRP_IMG_NRF5340_BOOTUTIL_HOOK=n
