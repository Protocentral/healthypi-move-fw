CONFIG_HEAP_MEM_POOL_SIZE=6144
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y

CONFIG_ASSERT=y
# NCS 3.2: DEBUG_INFO is undefined and EXCEPTION_STACK_TRACE needs ARCH_STACKWALK
# (unavailable on this minimal net-core image) - both were latent warnings now
# treated as fatal. Not needed for the HCI controller, so removed.

CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# Increase maximum data length of PDU supported in the Controller
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=502

CONFIG_BT_MAX_CONN=6

# Improve debugging experience by disabling reset on fatal error
CONFIG_RESET_ON_FATAL_ERROR=n

CONFIG_SERIAL=n
CONFIG_LOG=n
# The net core runs the HCI controller only - no console. Disable the console
# symbols too so they are consistent with SERIAL=n; the cpunet board defconfig
# enables UART_CONSOLE=y, which NCS >= 3.2 turns into a fatal warning when
# SERIAL is off.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n