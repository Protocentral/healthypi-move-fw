# Sysbuild configuration file.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
# M3: PM->DTS. External-flash secondary is now expressed in the board DTS
# (slot1_partition under &w25q01jv), not via this PM option.
#SB_CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=y

#SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES=2
#SB_CONFIG_MCUBOOT_COMPRESSED_IMAGE_SUPPORT=y

SB_CONFIG_NETCORE_APP_UPDATE=y
SB_CONFIG_SECURE_BOOT_NETCORE=y

# Required because our MCUboot secondary slots are off-chip (QSPI). Its Kconfig
# help says so directly: "network core image updates can be applied in a single
# operation. This is required if the secondary partition resides in off-chip
# memory." Safe here because we are overwrite-only (the help's brick warning
# applies only to revert-capable modes).
#
# This used to come for free: PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY (line 8,
# disabled by the PM->DTS migration) carries
#   select MCUBOOT_NRF53_MULTI_IMAGE_UPDATE if NETCORE_APP_UPDATE
# and nothing on the DTS path replaces it. Losing it silently compiled MCUboot's
# single-image net-core path instead, which reads the staged image with
#   struct image_header *hdr = (struct image_header *)secondary_fa->fa_off;
# — i.e. it treats the secondary's *flash offset* (0xd4000 on the QSPI part) as a
# CPU address, landing inside internal flash. The net core was then handed a
# garbage pointer, PCD reported "Network core update failed", and MCUboot erased
# the perfectly good staged image. With this symbol set, the image is copied
# through the flash API into the RAM-simulated slot2 partition first and
# boot_copy_region_post_hook() drives the PCD copy from there, which is what the
# flash_sim overlay exists for.
SB_CONFIG_MCUBOOT_NRF53_MULTI_IMAGE_UPDATE=y
#SB_CONFIG_NETCORE_HCI_IPC=y
SB_CONFIG_NETCORE_IPC_RADIO=y
# M3: PM->DTS migration — partitions now defined in the board devicetree.
SB_CONFIG_PARTITION_MANAGER=n

#SB_CONFIG_QSPI_XIP_SPLIT_IMAGE=y

SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APPLICATION_CONFIG_DIR}/keys/root-ec-p256.pem"
#SB_CONFIG_BOOT_ENCRYPTION_KEY_FILE="${APPLICATION_CONFIG_DIR}/keys/mcuboot_priv.pem"

SB_CONFIG_SECURE_BOOT_SIGNING_KEY_FILE="./keys/nsib_priv.pem"