name: Build and upload FW binaries

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-22.04
    # Zephyr 4.4 (NCS 3.4) sets PYTHON_MINIMUM_REQUIRED 3.12 and needs Zephyr
    # SDK 1.0.1 (zephyr/SDK_VERSION). The old v0.26.2 image ships Python 3.10.6,
    # so cmake configure failed at find_package(Python3) before compiling a single
    # file. v0.29.3 is the newest image carrying SDK 1.0.1 (added in v0.29.1;
    # v0.29.2/.3 are patches on the same SDK).
    container: ghcr.io/zephyrproject-rtos/ci:v0.29.3
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: healthypi_move

      - name: Initialize
        working-directory: healthypi_move
        run: |
          pip install ecdsa
          west init -l .
          west update -o=--depth=1 -n

      - name: Build base firmware
        working-directory: healthypi_move
        run: |
          west build app --pristine --board healthypi_move/nrf5340/cpuapp -- -DNCS_TOOLCHAIN_VERSION=NONE -DBOARD_ROOT=.

          # C5: refuse to publish an image that cannot be pushed over the air.
          # Slot is 0xd4000 = 868352 B, overwrite-only; keep ~16 KiB headroom.
          SIZE=$(stat -c%s build/app/zephyr/zephyr.signed.bin)
          echo "signed app image: $SIZE B / 868352 B slot"
          if [ "$SIZE" -gt 852000 ]; then
            echo "::error::app image $SIZE B exceeds the 852000 B budget (slot 868352 B)"
            exit 1
          fi

          if [ "${{ env.IS_RELEASE }}" = "true" ]; then
            mv build/merged.hex healthypi_move_${{ github.ref_name }}.hex
            mv build/merged_CPUNET.hex healthypi_move_cpunet_${{ github.ref_name }}.hex || true
            mv build/dfu_application.zip healthypi_move_update_${{ github.ref_name }}.zip
          else
            mv build/merged.hex healthypi_move_dev_${{ github.ref_name }}.hex
            mv build/merged_CPUNET.hex healthypi_move_dev_cpunet_${{ github.ref_name }}.hex || true
            mv build/dfu_application.zip healthypi_move_dev_update_${{ github.ref_name }}.zip
          fi

      - name: Upload release assets (Release)
        if: env.IS_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "healthypi_move/*.hex, healthypi_move/*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false

      - name: Upload release assets (Pre-release)
        if: env.IS_RELEASE == 'false'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "healthypi_move/*.hex, healthypi_move/*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true