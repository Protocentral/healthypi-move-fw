name: CI Build

# Builds every commit that lands on main (main only accepts squash merges, so
# this is one run per merged PR), plus manual runs. Feature branches and PRs
# are not built automatically.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-22.04
    # Zephyr 4.4 (NCS 3.4) sets PYTHON_MINIMUM_REQUIRED 3.12 and needs Zephyr
    # SDK 1.0.1 (zephyr/SDK_VERSION). The old v0.26.2 image ships Python 3.10.6,
    # so cmake configure failed at find_package(Python3) before compiling a single
    # file. v0.29.3 is the newest image carrying SDK 1.0.1 (added in v0.29.1;
    # v0.29.2/.3 are patches on the same SDK).
    container: ghcr.io/zephyrproject-rtos/ci:v0.29.3
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: healthypi_move

      - name: Initialize
        working-directory: healthypi_move
        run: |
          pip install ecdsa
          west init -l .
          west update -o=--depth=1 -n

      - name: Build firmware
        working-directory: healthypi_move
        run: |
          west build app --pristine --board healthypi_move/nrf5340/cpuapp -- -DNCS_TOOLCHAIN_VERSION=NONE -DBOARD_ROOT=.

      # C5: the app-core slot is 0xd4000 = 868352 B and MCUboot is overwrite-only,
      # so an image that outgrows the slot cannot be flashed over the air at all —
      # it has to be caught here, not on a fielded watch. Fail with ~16 KiB of
      # headroom left so there is room for a hotfix without a font/LVGL diet.
      - name: Check app image size
        working-directory: healthypi_move
        run: |
          BIN=build/app/zephyr/zephyr.signed.bin
          SLOT=868352      # 0xd4000, mcuboot_primary (see nrf5340_cpuapp_common.dtsi)
          LIMIT=852000     # slot minus ~16 KiB
          test -f "$BIN" || { echo "::error::$BIN not found"; exit 1; }
          SIZE=$(stat -c%s "$BIN")
          PCT=$(( SIZE * 100 / SLOT ))
          echo "signed app image: $SIZE B / $SLOT B slot (${PCT}%)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::app image $SIZE B exceeds the $LIMIT B budget (slot $SLOT B)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware-${{ github.sha }}
          path: |
            healthypi_move/build/merged.hex
            healthypi_move/build/merged_CPUNET.hex
            healthypi_move/build/dfu_application.zip
          retention-days: 30
